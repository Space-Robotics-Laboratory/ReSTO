mlivr_ramp:
  ros__parameters:

    # LRST
    use_lrst: true # true/false

    solver:
      dt: 0.01
      step_duration: 10.0
      step_height: 0.05

    weights:
      force_max: 1.0 # Max of linear component of derivative of momentum
      moment_max: 1.0 # Max of angular component of derivative of momentum
      step_height_max: 100.0
      step_height_ave: 100.0

    # MD
    alpha: 1.0 # Momentum distribution factor
