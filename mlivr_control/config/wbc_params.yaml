mlivr_wbc:
  ros__parameters:

    solver:
      horizon_steps: 2000
      dt: 0.01
      max_iter: 500

    weights:
      state_reg: 1e-5
      control_reg: 3e0

      base_pose_reg_diag: [1.0, 1.0, 1.0, 1.0, 1e3, 1.0] # [x, y, z, r, p, y]

      state_limits: 1e0
      control_limits: 1e-10

      sw_ee_tracking: 1e3
      sup_ee_tracking: 1e5
      ee_vel_damping: 3e0

      env_collision: 1e-5

      momentum_reg: 1e1

    weight_schedules:
      ctrl_reg:
        s_accel: 0.1
        s_decel: 0.7
        accel_multi: 50.0
        decel_multi: 100.0

      ee_vel:
        s_accel: 0.1
        s_decel: 0.7
        accel_multi: 50.0
        decel_multi: 100.0
