mlivr_wbc:
  ros__parameters:

    solver:
      horizon_steps: 2000
      dt: 0.01
      max_iter: 1000

    weights:
      state_reg: 1e-10
      control_reg: 1e0

      state_limits: 1e-2
      control_limits: 1e-10

      ee_tracking: 1e3
      sup_ee_tracking: 1e3
      ee_vel_damping: 0.0

      env_collision: 0.0

      momentum_reg: 1e0

    weight_schedules:
      ctrl_reg:
        s_accel: 0.5
        s_decel: 0.5
        accel_multi: 1.0
        decel_multi: 1.0

      ee_vel:
        s_accel: 0.5
        s_decel: 0.5
        accel_multi: 1.0
        decel_multi: 1.0
