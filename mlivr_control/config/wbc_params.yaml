mlivr_wbc:
  ros__parameters:

    solver:
      horizon_steps: 2000
      dt: 0.01
      max_iter: 500

    weights:
      state_reg: 6e-5
      control_reg: 1e0

      state_limits: 1e0
      control_limits: 1e-10

      sw_ee_tracking: 1e3
      sup_ee_tracking: 1e4
      ee_vel_damping: 1e0

      env_collision: 1e-5

      momentum_reg: 1e1

    weight_schedules:
      ctrl_reg:
        s_accel: 0.1
        s_decel: 0.8
        accel_multi: 50.0
        decel_multi: 50.0

      ee_vel:
        s_accel: 0.1
        s_decel: 0.8
        accel_multi: 50.0
        decel_multi: 50.0
